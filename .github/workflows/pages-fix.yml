name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-fix
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Nitro build adapter
        run: npm install nitro --no-save
      - name: Build
        run: npm run build
      - name: Prepare Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          if [ -d dist ]; then cp -R dist/. _site/; \
          elif [ -d .output/public ]; then cp -R .output/public/. _site/; \
          elif [ -d build ]; then cp -R build/. _site/; \
          else echo 'No supported build output found'; exit 1; fi
          if [ ! -f _site/index.html ] && [ -f public/index.html ]; then cp public/index.html _site/index.html; fi
          test -f _site/index.html
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
